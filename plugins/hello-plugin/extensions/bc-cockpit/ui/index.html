<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>BC Cockpit</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 3.2a6.8 6.8 0 0 1 6.6 5.2h-3.4a3.4 3.4 0 0 0-6.4 0H5.4A6.8 6.8 0 0 1 12 5.2Zm0 13.6a6.8 6.8 0 0 1-6.6-5.2h3.4a3.4 3.4 0 0 0 6.4 0h3.4a6.8 6.8 0 0 1-6.6 5.2Z" fill="currentColor"/></svg>
    </span>
    <div class="titles">
      <h1>BC Cockpit</h1>
      <p class="sub" id="summary" aria-live="polite">Loading…</p>
    </div>
  </div>
  <div class="tools">
    <span class="fetched" id="fetched"></span>
    <button type="button" class="pill warn" id="errorsBtn" hidden aria-expanded="false" aria-controls="errorsPanel"></button>
    <button type="button" class="btn" id="refreshBtn"><span class="spin" aria-hidden="true"></span><span>Refresh</span></button>
  </div>
  <div class="progress" aria-hidden="true"></div>
</header>

<section class="errors" id="errorsPanel" hidden aria-label="Fetch errors"></section>
<div id="banner" role="alert" hidden></div>

<main class="board">
  <section class="panel" aria-labelledby="h-sprint">
    <h2 id="h-sprint"><span class="dot work" aria-hidden="true"></span>Sprint <span class="count" id="c-work">0</span></h2>
    <div id="work"></div>
  </section>
  <section class="panel" aria-labelledby="h-prs">
    <h2 id="h-prs"><span class="dot prs" aria-hidden="true"></span>Pull requests <span class="count" id="c-prs">0</span></h2>
    <div id="prs"></div>
  </section>
</main>

<div class="toast-host" id="toasts" role="status" aria-live="polite"></div>
<script src="app.js" type="module"></script>
</body>
</html>
